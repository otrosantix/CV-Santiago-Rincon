      <h2 class="mb-0">Formulario de Contacto</h2> <!-- Título de segundo nivel sin margen inferior -->
      <hr class="w-25 my-3"> <!-- Línea horizontal que ocupa el 25% del ancho con márgenes verticales -->
      <p class="text-secondary mb-4">Escríbeme y te responderé lo antes posible.</p> <!-- Párrafo descriptivo en color secundario con margen inferior -->

      <form action="forms/contact.php" method="post"> <!-- Formulario que envía datos por POST al archivo contact.php -->
        <div class="row g-3"> <!-- Fila de Bootstrap con separación entre columnas -->
          <div class="col-md-6"> <!-- Columna que ocupa 6 de 12 en pantallas medianas -->
            <label for="name-field" class="form-label">Nombre</label> <!-- Etiqueta para el campo de nombre -->
            <input type="text" name="name" id="name-field" class="form-control" required> <!-- Campo de texto obligatorio para el nombre -->
          </div> <!-- Cierra la columna del nombre -->
          <div class="col-md-6"> <!-- Columna que ocupa 6 de 12 en pantallas medianas -->
            <label for="email-field" class="form-label">Email</label> <!-- Etiqueta para el campo de email -->
            <input type="email" name="email" id="email-field" class="form-control" required> <!-- Campo de email obligatorio -->
          </div> <!-- Cierra la columna del email -->
          <div class="col-12"> <!-- Columna que ocupa todo el ancho -->
            <label for="subject-field" class="form-label">Motivo</label> <!-- Etiqueta para el campo de motivo -->
            <input type="text" name="subject" id="subject-field" class="form-control" required> <!-- Campo de texto obligatorio para el motivo -->
          </div> <!-- Cierra la columna del motivo -->
          <div class="col-12"> <!-- Columna que ocupa todo el ancho -->
            <label for="message-field" class="form-label">Mensaje</label> <!-- Etiqueta para el campo de mensaje -->
            <textarea name="message" id="message-field" rows="6" class="form-control" required></textarea> <!-- Área de texto obligatoria de 6 filas para el mensaje -->
          </div> <!-- Cierra la columna del mensaje -->
          <div class="col-12 text-center pt-2"> <!-- Columna completa con texto centrado y padding superior -->
            <button type="submit" class="btn btn-primary px-4">Enviar mensaje</button> <!-- Botón de envío con estilo primario y padding horizontal -->
          </div> <!-- Cierra la columna del botón -->
        </div> <!-- Cierra la fila del formulario -->
      </form> <!-- Cierra el formulario -->
    </section> <!-- Cierra la sección del formulario -->
  </main> <!-- Cierra el contenido principal -->
